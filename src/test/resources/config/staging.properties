# The deployed QualityLab site. This is the default environment.
# Credentials are not stored here: set TEST_USERNAME, TEST_PASSWORD, ADMIN_USERNAME, and ADMIN_PASSWORD
# as environment variables, or in the git-ignored secrets.properties next to this file.
BASE_URL=https://quality-lab-jb.vercel.app
BROWSER=chrome
HEADLESS=false
TIMEOUT_SECONDS=25

# Open reports/summary/test-report.html in Chrome after a run: always, on-failure, or never (never on CI)
OPEN_REPORT=always
